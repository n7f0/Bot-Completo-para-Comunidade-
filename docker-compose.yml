version: '3.8'

services:
  bot:
    build: .
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_VOICE_IPV6=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Adiciona configuração de DNS via /etc/resolv.conf no runtime
    dns_config:
      nameservers:
        - 8.8.8.8
        - 8.8.4.4
      options:
        - name: ndots
          value: "0"