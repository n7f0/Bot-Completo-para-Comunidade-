version: '3.8'

services:
  bot:
    build: .
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # DNS confiável para evitar erro "Name or service not known" no Discord Voice
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # NOTA: Não é necessário mapear portas UDP.
    # O Discord Voice usa conexões UDP de SAÍDA (outbound),
    # que o Docker já permite por padrão via NAT.