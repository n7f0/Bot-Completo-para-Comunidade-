version: '3.8'

services:
  bot:
    build: .
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_VOICE_IPV6=0          # Força IPv4
      - PYTHONUNBUFFERED=1            # Logs em tempo real
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    network_mode: host
    # Adicional: se mesmo com host falhar, tente com rede bridge e portas mapeadas
    # ports:
    #   - "5000-6000:5000-6000/udp"   # Não é necessário com host, mas pode ajudar